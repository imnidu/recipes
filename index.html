<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Кулінарна книга</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22%D0%9A%D1%83%D0%BB%D1%96%D0%BD%D0%B0%D1%80%D0%BD%D0%B0%20%D0%BA%D0%BD%D0%B8%D0%B3%D0%B0%22%2C%22display%22%3A%22standalone%22%7D">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:wght@400;600&family=Marck+Script&family=Comfortaa:wght@400;700&family=Playfair+Display:wght@600&family=Pacifico&family=Neucha&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe4cf;--paper:#fffaf0;--ink:#3b2f2f;--soft:#8a7968;--line:#d6e2ec;--margin:#e9a5a0;--accent:#b5543c;--card:#fffdf7;--sh:rgba(80,50,20,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--paper:#2a231e;--ink:#eadfce;--soft:#a39482;--line:#38322c;--margin:#7a4a46;--accent:#e08a6c;--card:#30281f;--sh:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#1c1713;--paper:#2a231e;--ink:#eadfce;--soft:#a39482;--line:#38322c;--margin:#7a4a46;--accent:#e08a6c;--card:#30281f;--sh:rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/28px var(--bf,Lora,Georgia,serif);padding-bottom:90px;max-width:640px;margin:0 auto}
h1,h2,h3,.hand{font-family:var(--hf,Caveat,cursive);font-weight:700;margin:0;line-height:1.1}
h1{font-size:40px;text-align:center;padding:18px 12px 4px;color:var(--accent)}
h2{font-size:38px;margin:6px 0 4px}h3{font-size:28px;margin:14px 0 2px;color:var(--accent)}
.sub{text-align:center;color:var(--soft);margin:0 0 8px;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:6px 10px;color:var(--accent);font-size:17px}
input,select,textarea{width:100%;background:var(--card);border:1px dashed var(--soft);border-radius:8px;padding:8px 10px;margin:4px 0;line-height:1.4}
textarea{resize:vertical}
.srch{margin:6px 14px;width:calc(100% - 28px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 8px}
.chips span{flex:none;padding:2px 14px;border-radius:99px;border:1px solid var(--soft);font-size:14px;line-height:26px;cursor:pointer}
.chips .on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.card{display:flex;gap:12px;align-items:center;margin:10px 14px;padding:10px;background:var(--card);border-radius:10px;box-shadow:0 2px 6px var(--sh);cursor:pointer;line-height:1.3}
.th{width:64px;height:64px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:34px;overflow:hidden;flex:none}
.th img,.hero img{width:100%;height:100%;object-fit:cover}
.ci{flex:1;min-width:0}.ci b{display:block;font:700 24px var(--hf,Caveat,cursive)}.ci small{color:var(--soft)}
.st{color:#e0a030;margin-left:8px;font-size:13px}.hr{color:var(--accent);font-size:20px}
.pg{margin:10px 14px;padding:14px 16px 18px 24px;border-radius:6px;box-shadow:0 3px 10px var(--sh);border-left:2px solid var(--margin);background:var(--paper) repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px)}
[data-pat=grid] .pg{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
[data-pat=dots] .pg{background-image:radial-gradient(var(--line) 1.6px,transparent 1.8px);background-size:28px 28px}
[data-pat=plain] .pg{background-image:none}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 14px}
.sk{padding:10px 12px;border:2px solid;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;line-height:1.2}
.sk b{font-size:26px;font-weight:400}.sk.on{box-shadow:0 0 0 3px var(--accent)}.sk span{width:16px;height:16px;border-radius:50%;flex:none}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 0}
.hero{height:190px;border-radius:8px;overflow:hidden;margin-bottom:8px;background:var(--bg);display:grid;place-items:center}
.em{font-size:80px;line-height:1}
.meta{color:var(--soft);margin:0}
.rate i{font-style:normal;font-size:26px;color:var(--soft);cursor:pointer;padding:0 3px}.rate .on{color:#e0a030}
.srv{display:flex;align-items:center;gap:10px}.srv button{border:1px solid var(--accent);border-radius:50%;width:32px;height:32px;line-height:1;padding:0}
ul,ol{margin:0;padding-left:22px}ol{counter-reset:s;list-style:none;padding:0}
li{cursor:pointer}ul li.x,ol li.x{text-decoration:line-through;opacity:.5}
ol li{counter-increment:s;padding-left:34px;position:relative}
ol li:before{content:counter(s);position:absolute;left:0;font:700 24px var(--hf,Caveat,cursive);color:var(--accent)}
.note{font-style:italic;margin:0}
.btn{border:1px solid var(--accent);border-radius:8px;margin:8px 6px 0 0}
.pri{background:var(--accent);color:var(--paper);border-radius:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.row input{width:70px;margin:8px 0 0}
.two{display:flex;gap:8px}
label{font:700 22px var(--hf,Caveat,cursive);color:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;font-size:12px;line-height:1.2;color:var(--soft)}
.tabs .on{color:var(--accent)}.tabs b{font-size:22px;font-weight:400}
#tm{position:fixed;left:14px;right:14px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--paper);border-radius:12px;padding:8px 14px;display:none;justify-content:space-between;align-items:center;z-index:6;line-height:1.2}
#tm button{color:var(--paper)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 16px;border-radius:99px;font-size:14px;line-height:1.4;display:none;z-index:9}
.empty{text-align:center;color:var(--soft);padding:30px}
.shop{display:flex;gap:6px}.shop input{flex:1}
</style></head><body>
<div id="app"></div><div id="tm"><span id="tt"></span><button data-act="tmx">Стоп</button></div><div id="toast"></div>
<nav class="tabs">
<button data-act="tab" data-v="list"><b>📖</b>Рецепти</button>
<button data-act="new"><b>✏️</b>Додати</button>
<button data-act="tab" data-v="shop"><b>🛒</b>Покупки</button>
<button data-act="tab" data-v="style"><b>🎨</b>Стиль</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(x){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(x){toast("Не вдалося зберегти: мало місця")}};
const CATS=["Сніданок","Обід","Вечеря","Десерти","Випічка","Напої","Інше"],DIF=["Легко","Середньо","Складно"];
const seed=[
{id:"a1",t:"Домашній борщ",em:"🍲",cat:"Обід",time:90,srv:6,dif:"Середньо",fav:true,rate:5,ph:"",
ing:["500 г яловичини на кістці","300 г буряка","300 г капусти","2 картоплини","1 морква","1 цибулина","2 ст. л. томатної пасти","3 зубчики часнику","Сіль, лавровий лист, сметана"],
steps:["Зваріть бульйон з м’яса, знімаючи піну.","Обсмажте цибулю, моркву та буряк із томатною пастою.","Додайте в бульйон картоплю, за 10 хвилин — капусту.","Висипте засмажку, посоліть, додайте лавровий лист.","Наприкінці додайте часник і дайте настоятися 20 хвилин."],
note:"Краще наступного дня. Подавати зі сметаною та пампушками."},
{id:"a2",t:"Сирники",em:"🥞",cat:"Сніданок",time:25,srv:4,dif:"Легко",fav:false,rate:4,ph:"",
ing:["400 г сиру","1 яйце","3 ст. л. борошна","2 ст. л. цукру","1 ч. л. ванілі","Олія для смаження"],
steps:["Змішайте сир, яйце, цукор і ваніль.","Додайте борошно, замісіть м’яке тісто.","Сформуйте сирники й обваляйте в борошні.","Смажте по 3 хвилини з кожного боку на середньому вогні."],
note:"Якщо сир вологий — відтисніть його через марлю."}];
let R=ld("rc",null);if(!R){R=seed;store("rc",R)}
let S=ld("shop",[]);
let v="list",f="Всі",q="",cur=null,n=0,chk={},ph="",ed=null,tmr=null;
const flt=()=>R.filter(r=>(f==="Всі"||(f==="♥"?r.fav:r.cat===f))&&(!q||(r.t+" "+r.ing.join(" ")).toLowerCase().includes(q.toLowerCase())));
const card=r=>`<div class="card" data-act="open" data-id="${r.id}"><div class="th">${r.ph?`<img src="${r.ph}" alt="">`:e(r.em)}</div><div class="ci"><b>${e(r.t)}</b><small>${e(r.cat)} · ${r.time||"–"} хв</small><span class="st">${"★".repeat(r.rate||0)}</span></div><span class="hr">${r.fav?"♥":""}</span></div>`;
const cards=()=>{const l=flt();return l.length?l.map(card).join(""):`<div class="empty">Тут поки порожньо.<br>Додайте перший рецепт ✏️</div>`};
function sc(l,k){const m=l.match(/^(\d+(?:[.,]\d+)?(?:\/\d+)?)(?![\d\-–])\s*(.*)$/);if(!m||k===1)return l;let x=m[1].includes("/")?m[1].split("/")[0]/m[1].split("/")[1]:parseFloat(m[1].replace(",","."));x=Math.round(x*k*100)/100;return String(x).replace(".",",")+" "+m[2]}
function vList(){return `<h1>Моя кулінарна книга</h1><p class="sub">${R.length} рецептів</p>${bk()}<input class="srch" id="q" placeholder="Пошук за назвою чи інгредієнтом…" value="${e(q)}"><div class="chips">${["Всі","♥",...CATS].map(c=>`<span data-act="chip" data-c="${c}" class="${c===f?"on":""}">${c==="♥"?"♥ Улюблені":c}</span>`).join("")}</div><div id="lst">${cards()}</div>`}
function vDet(){const r=R.find(x=>x.id===cur);const k=n/r.srv;const c=chk[cur]=chk[cur]||{};
return `<div class="bar"><button data-act="back">‹ Назад</button><span><button data-act="fav">${r.fav?"♥":"♡"}</button><button data-act="edit">✎</button></span></div>
<div class="pg"><div class="hero">${r.ph?`<img src="${r.ph}" alt="">`:`<div class="em">${e(r.em)}</div>`}</div>
<h2>${e(r.t)}</h2><p class="meta">${e(r.cat)} · ⏱ ${r.time||"–"} хв · ${e(r.dif)}</p>
<div class="rate">${[1,2,3,4,5].map(i=>`<i data-act="rate" data-n="${i}" class="${i<=r.rate?"on":""}">★</i>`).join("")}</div>
<div class="srv">Порцій: <button data-act="srv" data-d="-1">−</button><b>${n}</b><button data-act="srv" data-d="1">+</button></div>
<h3>Інгредієнти</h3><ul>${r.ing.map((l,i)=>`<li data-act="ing" data-i="${i}" class="${c["i"+i]?"x":""}">${e(sc(l,k))}</li>`).join("")}</ul>
<button class="btn" data-act="addshop">🛒 У список покупок</button>
<h3>Приготування</h3><ol>${r.steps.map((l,i)=>`<li data-act="step" data-i="${i}" class="${c["s"+i]?"x":""}">${e(l)}</li>`).join("")}</ol>
${r.note?`<h3>Нотатки</h3><p class="note">${e(r.note)}</p>`:""}
<div class="row"><input id="tmin" type="number" value="${r.time||10}" min="1"><button class="btn" data-act="tm">⏱ Таймер, хв</button><button class="btn" data-act="share">📋 Копіювати</button></div></div>`}
function vEdit(){const r=ed||{t:"",em:"🍽️",cat:"Обід",time:"",srv:4,dif:"Легко",ing:[],steps:[],note:""};ph=r.ph||"";
return `<div class="bar"><button data-act="cancel">‹ Скасувати</button><button class="pri" data-act="save">Зберегти</button></div>
${ed?"":AIBOX}<div class="pg"><label>Назва</label><input id="f_t" value="${e(r.t)}" placeholder="Наприклад, Лимонний пиріг">
<div class="two"><input id="f_em" value="${e(r.em)}" maxlength="4" style="width:70px;text-align:center"><select id="f_cat">${CATS.map(c=>`<option${c===r.cat?" selected":""}>${c}</option>`).join("")}</select></div>
<div class="two"><input id="f_time" type="number" placeholder="Хвилин" value="${r.time}"><input id="f_srv" type="number" placeholder="Порцій" value="${r.srv}"><select id="f_dif">${DIF.map(c=>`<option${c===r.dif?" selected":""}>${c}</option>`).join("")}</select></div>
<label>Фото</label><input id="f_ph" type="file" accept="image/*">
<label>Інгредієнти</label><textarea id="f_ing" rows="6" placeholder="Кожен з нового рядка, напр.: 200 г борошна">${e(r.ing.join("\n"))}</textarea>
<label>Кроки</label><textarea id="f_st" rows="6" placeholder="Кожен крок з нового рядка">${e(r.steps.join("\n"))}</textarea>
<label>Нотатки</label><textarea id="f_note" rows="3" placeholder="Поради, історія рецепта…">${e(r.note)}</textarea>
${ed?`<button class="btn" data-act="del">🗑 Видалити рецепт</button>`:""}</div>`}
function vShop(){return `<h1>Список покупок</h1><p class="sub">Торкніться, щоб відмітити</p><div class="pg"><div class="shop"><input id="si" placeholder="Додати товар…"><button class="btn" data-act="sadd" style="margin:4px 0">+</button></div><ul style="list-style:none;padding:0">${S.map((x,i)=>`<li data-act="sx" data-i="${i}" class="${x.d?"x":""}">${x.d?"☑":"☐"} ${e(x.t)}</li>`).join("")||'<li class="empty" style="cursor:default">Список порожній</li>'}</ul><button class="btn" data-act="sclr">Прибрати відмічені</button></div>`}
let P=ld("pf",{skin:"cl",pat:"lines",ac:""});
const V=["--bg","--paper","--ink","--soft","--line","--margin","--accent","--card","--sh","--hf","--bf"];
const CV=["#efe4cf","#fffaf0","#3b2f2f","","","","#b5543c","","","Caveat,cursive",""];
const SK=[{id:"cl",n:"Класика"},
{id:"sa",n:"Сакура",pat:"lines",v:["#f8e4ea","#fff7f9","#5a3a45","#a77f8c","#f3cfda","#f0a0b8","#d6537f","#fffbfc","rgba(120,40,70,.18)","'Marck Script',cursive","Lora,serif"]},
{id:"mt",n:"М’ята",pat:"grid",v:["#dcebe3","#f7fcf9","#2f4a42","#6f968a","#cfe6dc","#9ccfb8","#2f9b75","#fbfffd","rgba(30,80,60,.18)","Comfortaa,sans-serif","Comfortaa,sans-serif"]},
{id:"lv",n:"Лаванда",pat:"dots",v:["#e6e0f3","#fbf9ff","#3f3560","#8d82b3","#e0d9f2","#b9a8e8","#7a5ad0","#fdfcff","rgba(60,40,120,.2)","Pacifico,cursive","Lora,serif"]},
{id:"cf",n:"Кав’ярня",pat:"lines",v:["#17120e","#241d17","#f0e2cc","#a89478","#342b22","#8a5a44","#e3a35f","#2c231b","rgba(0,0,0,.6)","'Playfair Display',serif","Lora,serif"]},
{id:"kr",n:"Крафт",pat:"dots",v:["#c9a97a","#e2c9a0","#3a2a18","#7a5f3c","#d1b387","#b5835a","#8a3b22","#ecd7b2","rgba(60,35,10,.3)","Neucha,cursive","Neucha,cursive"]},
{id:"oc",n:"Океан",pat:"grid",v:["#d8e8f3","#f6fbff","#1f3b52","#6b8fab","#d3e6f4","#9cc4e4","#2b7fc4","#fbfeff","rgba(20,60,100,.18)","Caveat,cursive","Lora,serif"]}];
const PT=[["lines","Лінійка"],["grid","Клітинка"],["dots","Крапки"],["plain","Чистий"]];
function ap(){const d=document.documentElement,s=SK.find(x=>x.id===P.skin)||SK[0];V.forEach((k,i)=>s.v?d.style.setProperty(k,s.v[i]):d.style.removeProperty(k));if(P.ac)d.style.setProperty("--accent",P.ac);d.dataset.pat=P.pat}
document.addEventListener("input",ev=>{if(ev.target.id==="ac"){P.ac=ev.target.value;store("pf",P);ap()}});
function vStyle(){return `<h1>Стиль</h1><p class="sub">Обери настрій своєї книги</p><div class="skins">${SK.map(s=>{const w=s.v||CV;return `<div class="sk${s.id===P.skin?" on":""}" data-act="skin" data-id="${s.id}" style="background:${w[1]};color:${w[2]};border-color:${w[6]}"><b style="font-family:${w[9]}">${s.n}</b><span style="background:${w[6]}"></span></div>`}).join("")}</div>
<div class="pg"><label>Папір</label><div class="chips" style="padding:2px 0 8px">${PT.map(x=>`<span data-act="pat" data-p="${x[0]}" class="${x[0]===P.pat?"on":""}">${x[1]}</span>`).join("")}</div>
<label>Свій колір акцентів</label><div class="row" style="margin:0"><input id="ac" type="color" value="${P.ac||"#b5543c"}" style="width:64px;height:40px;padding:2px"><button class="btn" data-act="acr">Скинути</button></div></div>
<div class="pg"><h3 style="margin-top:0">Обмін рецептами</h3><button class="btn" data-act="exp">📤 Скопіювати всі рецепти</button><textarea id="imp" rows="3" placeholder="Встав сюди скопійовані рецепти…"></textarea><button class="btn" data-act="imp">📥 Імпортувати</button></div>
<div class="pg"><h3 style="margin-top:0">Резервна копія 💾</h3><button class="btn" data-act="bkp">💾 Зберегти копію</button><button class="btn" data-act="rst">📂 Відновити</button><input id="rf" type="file" accept=".json,application/json" style="display:none"><div class="meta">Файл з усіма рецептами, фото та стилем. Збережи його у Файли, iCloud або надішли собі в Telegram.</div></div>
<div class="pg"><h3 style="margin-top:0">Сервер імпорту</h3><input id="wu" placeholder="https://назва.акаунт.workers.dev" value="${e(WU())}"><div class="meta">Адреса твого Cloudflare Worker для імпорту за посиланням.</div></div>
<div class="pg"><h3 style="margin-top:0">Для подруги 💌</h3><p style="margin:0">Надішли їй посилання на цю сторінку. У неї буде своя книга: її рецепти та стиль зберігаються лише в її телефоні.</p></div>`}
const WORKER_URL="";
try{const q=new URLSearchParams(location.search).get("s");if(q&&/^https:\/\//.test(q))localStorage.setItem("wu",q)}catch(x){}
const WU=()=>{try{return localStorage.getItem("wu")||WORKER_URL}catch(x){return WORKER_URL}};
document.addEventListener("input",ev=>{if(ev.target.id==="wu"){try{localStorage.setItem("wu",ev.target.value.trim())}catch(x){}}});
const AIBOX=`<div class="pg"><label>✨ Імпорт з TikTok</label><input id="i_url" placeholder="Встав посилання на відео"><textarea id="i_txt" rows="3" placeholder="Або встав сюди опис / текст рецепта…"></textarea><div class="meta">Читаю назву й опис відео та розкладаю по полях. Рецепт, який лише озвучений у відео, без опису не знайти.</div><button class="btn" data-act="ai">✨ Розписати рецепт</button><span id="ai_s"></span></div>`;
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(x){}

function parseText(raw){
const L=raw.replace(/#[\p{L}\d_]+/gu,"").split("\n").map(x=>x.trim()).filter(Boolean);if(!L.length)return null;
const cl=x=>x.replace(/^[\s•\-–—*·▪✅🔸👉✔️]+/u,"").replace(/^\d+[.)]\s*/,"").trim();
const HA=/^(інгредієнти|склад|ingredients|вам знадобиться|знадобиться)(?=[\s:!\-–]|$)[\s:!\-–]*(.*)$/i,HB=/^(приготування|спосіб приготування|як готувати|кроки|інструкція|спосіб|method|instructions|directions|steps)(?=[\s:!\-–]|$)[\s:!\-–]*(.*)$/i;
let m=0,ing=[],st=[],hd=[];
for(const l of L){const a=l.match(HA),b=l.match(HB);
if(a){m=1;if(a[2])ing.push(cl(a[2]));continue}
if(b){m=2;if(b[2])st.push(cl(b[2]));continue}
if(m===1)ing.push(cl(l));else if(m===2)st.push(cl(l));
else if(/^\d+[.)]\s/.test(l))st.push(cl(l));
else if(/^[•\-–—*·]\s*\d/.test(l)||/^\d+([.,]\d+)?\s*(г|кг|мл|л|ст|ч|шт|склян|зуб|пучок)/i.test(l))ing.push(cl(l));
else hd.push(l)}
const UN="(?:г|гр|кг|мл|л|шт|ст\\.?\\s?л\\.?|ч\\.?\\s?л\\.?|склянк\\w*|зубч\\w*|пучок|щіпк\\w*)";
const QT=new RegExp("^(.+?)\\s+(\\d+(?:[.,]\\d+)?(?:-\\d+)?\\s*"+UN+")$","i");
const norm=x=>{const q=x.match(QT);return q?q[2]+" "+q[1].charAt(0).toLowerCase()+q[1].slice(1):x};
if(!ing.length&&!st.length&&hd.length>3){const r=hd.slice(1);if(r.filter(x=>QT.test(x)).length>=2){hd=[hd[0]];r.forEach(x=>{if(/смачного|приємного|підпису|дякую/i.test(x))return;if(x.length<=45&&!/[.!?]$/.test(x))ing.push(x);else st.push(x)})}}
ing=ing.map(norm);
let t=(hd[0]||"").trim();const em=(t.match(/\p{Extended_Pictographic}/u)||[])[0]||"🍽️";
t=t.replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,"").trim();
const up=t.replace(/[^\p{L}]/gu,"");if(up.length>3&&up===up.toUpperCase())t=t.charAt(0)+t.slice(1).toLowerCase();
const tm=raw.match(/(\d+)\s*(?:хв|хвилин)/i),sv=raw.match(/(\d+)\s*(?:порці|персон)/i);
return{t:t.slice(0,70),em,cat:"Інше",time:tm?+tm[1]:0,srv:sv?+sv[1]:0,dif:"Легко",ing,steps:st,note:hd.slice(1).join("\n").slice(0,500)}}
